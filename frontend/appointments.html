<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Appointment Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background-color: #1976d2;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            font-size: 16px;
        }

        /* =========================
           NAVIGATION BAR
        ========================= */

        nav {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            background-color: #125ca8;
            padding: 10px 16px;
            border-radius: 5px;
            font-size: 14px;
        }

        nav a:hover {
            background-color: #0d477f;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h2 {
            text-align: center;
            color: #1976d2;
        }

        /* =========================
           FORM
        ========================= */

        form {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 900px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

            border-radius: 8px;
        }

        select,
        input,
        textarea {
            padding: 10px;
            font-size: 15px;

            border: 1px solid #ccc;
            border-radius: 5px;

            width: 100%;
        }

        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #1976d2;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            padding: 10px 15px;

            color: white;
            border: none;
            border-radius: 5px;

            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        /* Add / Update */

        .submit-button {
            grid-column: span 2;
            padding: 12px;
            font-size: 16px;
            background-color: #1976d2;
        }

        .submit-button:hover {
            background-color: #125ca8;
        }

        /* Edit */

        .edit-button {
            background-color: #0d47a1;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #08306b;
        }

        /* Delete */

        .delete-button {
            background-color: #d32f2f;
        }

        .delete-button:hover {
            background-color: #b71c1c;
        }

        /* Cancel */

        .cancel-button {
            grid-column: span 2;
            background-color: #1976d2;
            display: none;
        }

        .cancel-button:hover {
            background-color: #125ca8;
        }

        /* =========================
           TABLE
        ========================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 30px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f7fc;
        }

        tr:hover {
            background-color: #e3f2fd;
        }

        .status {
            font-weight: bold;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 40px;
            background-color: #1976d2;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                align-items: center;
            }

            nav a {
                width: 200px;
                text-align: center;
            }

            form {
                grid-template-columns: 1fr;
            }

            .submit-button,
            .cancel-button {
                grid-column: span 1;
            }

            header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        E-Health Management System
    </h1>

    <p>
        Appointment Management
    </p>

    <!-- NAVIGATION -->

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="patients.html">
            Patients
        </a>

        <a href="doctors.html">
            Doctors
        </a>

        <a href="appointments.html">
            Appointments
        </a>

        <a href="medical-records.html">
            Medical Records
        </a>

    </nav>

</header>

<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container">

    <h2>
        Appointment Management
    </h2>

    <!-- =========================
         APPOINTMENT FORM
    ========================= -->

    <form id="appointmentForm">

        <!-- Patient -->

        <select id="patient_id" required>

            <option value="">
                Select Patient
            </option>

        </select>

        <!-- Doctor -->

        <select id="doctor_id" required>

            <option value="">
                Select Doctor
            </option>

        </select>

        <!-- Date -->

        <input
            type="date"
            id="appointment_date"
            required
        >

        <!-- Time -->

        <input
            type="time"
            id="appointment_time"
            required
        >

        <!-- Reason -->

        <textarea
            id="reason"
            placeholder="Enter reason for appointment"
        ></textarea>

        <!-- Status -->

        <select id="status" required>

            <option value="Scheduled">
                Scheduled
            </option>

            <option value="Completed">
                Completed
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>

        <!-- Add / Update -->

        <button
            type="submit"
            id="submitButton"
            class="submit-button"
        >
            Add Appointment
        </button>

        <!-- Cancel -->

        <button
            type="button"
            id="cancelButton"
            class="cancel-button"
            onclick="cancelEdit()"
        >
            Cancel
        </button>

    </form>

    <!-- =========================
         APPOINTMENT TABLE
    ========================= -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Specialization</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="appointmentTable"></tbody>

        </table>

    </div>

</div>

<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        E-Health Management System
    </p>

</footer>

<script>

    // ==========================================
    // EDITING APPOINTMENT ID
    // ==========================================

    let editingAppointmentId = null;

    // ==========================================
    // LOAD PATIENTS
    // ==========================================

    function loadPatients() {

        fetch("/api/patients")

            .then(response => response.json())

            .then(patients => {

                const patientSelect =
                    document.getElementById("patient_id");

                patientSelect.innerHTML = `
                    <option value="">
                        Select Patient
                    </option>
                `;

                patients.forEach(patient => {

                    const option =
                        document.createElement("option");

                    option.value =
                        patient.id;

                    option.textContent =
                        `${patient.name} (ID: ${patient.id})`;

                    patientSelect.appendChild(option);

                });

            })

            .catch(error => {

                console.error(
                    "Error loading patients:",
                    error
                );

            });

    }

    // ==========================================
    // LOAD DOCTORS
    // ==========================================

    function loadDoctors() {

        fetch("/api/doctors")

            .then(response => response.json())

            .then(doctors => {

                const doctorSelect =
                    document.getElementById("doctor_id");

                doctorSelect.innerHTML = `
                    <option value="">
                        Select Doctor
                    </option>
                `;

                doctors.forEach(doctor => {

                    const option =
                        document.createElement("option");

                    option.value =
                        doctor.id;

                    option.textContent =
                        `${doctor.name} - ${doctor.specialization}`;

                    doctorSelect.appendChild(option);

                });

            })

            .catch(error => {

                console.error(
                    "Error loading doctors:",
                    error
                );

            });

    }

    // ==========================================
    // LOAD APPOINTMENTS
    // ==========================================

    function loadAppointments() {

        fetch("/api/appointments")

            .then(response => response.json())

            .then(appointments => {

                const table =
                    document.getElementById(
                        "appointmentTable"
                    );

                table.innerHTML = "";

                appointments.forEach(appointment => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${appointment.id}</td>

                        <td>${appointment.patient_name}</td>

                        <td>${appointment.doctor_name}</td>

                        <td>${appointment.specialization}</td>

                        <td>
                            ${formatDate(
                                appointment.appointment_date
                            )}
                        </td>

                        <td>
                            ${formatTime(
                                appointment.appointment_time
                            )}
                        </td>

                        <td>
                            ${appointment.reason || ""}
                        </td>

                        <td class="status">
                            ${appointment.status}
                        </td>

                        <td>

                            <button
                                class="edit-button"
                                onclick="editAppointment(${appointment.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-button"
                                onclick="deleteAppointment(${appointment.id})"
                            >
                                Delete
                            </button>

                        </td>

                    `;

                    table.appendChild(row);

                });

            })

            .catch(error => {

                console.error(
                    "Error loading appointments:",
                    error
                );

            });

    }

    // ==========================================
    // ADD / UPDATE APPOINTMENT
    // ==========================================

    document
        .getElementById("appointmentForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const appointmentData = {

                    patient_id:
                        document.getElementById(
                            "patient_id"
                        ).value,

                    doctor_id:
                        document.getElementById(
                            "doctor_id"
                        ).value,

                    appointment_date:
                        document.getElementById(
                            "appointment_date"
                        ).value,

                    appointment_time:
                        document.getElementById(
                            "appointment_time"
                        ).value,

                    reason:
                        document.getElementById(
                            "reason"
                        ).value,

                    status:
                        document.getElementById(
                            "status"
                        ).value

                };

                let url = "/api/appointments";

                let method = "POST";

                if (editingAppointmentId !== null) {

                    url =
                        `/api/appointments/${editingAppointmentId}`;

                    method = "PUT";

                }

                fetch(url, {

                    method: method,

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(appointmentData)

                })

                .then(response => response.json())

                .then(data => {

                    if (data.error) {

                        alert(data.error);

                        return;

                    }

                    alert(data.message);

                    resetForm();

                    loadAppointments();

                })

                .catch(error => {

                    console.error(
                        "Error saving appointment:",
                        error
                    );

                });

            }
        );

    // ==========================================
    // EDIT APPOINTMENT
    // ==========================================

    function editAppointment(id) {

        fetch("/api/appointments")

            .then(response => response.json())

            .then(appointments => {

                const appointment =
                    appointments.find(
                        a => a.id === id
                    );

                if (!appointment) {

                    alert("Appointment not found");

                    return;

                }

                editingAppointmentId = id;

                document.getElementById(
                    "patient_id"
                ).value =
                    appointment.patient_id;

                document.getElementById(
                    "doctor_id"
                ).value =
                    appointment.doctor_id;

                document.getElementById(
                    "appointment_date"
                ).value =
                    formatDateForInput(
                        appointment.appointment_date
                    );

                document.getElementById(
                    "appointment_time"
                ).value =
                    formatTimeForInput(
                        appointment.appointment_time
                    );

                document.getElementById(
                    "reason"
                ).value =
                    appointment.reason || "";

                document.getElementById(
                    "status"
                ).value =
                    appointment.status;

                document.getElementById(
                    "submitButton"
                ).textContent =
                    "Update Appointment";

                document.getElementById(
                    "cancelButton"
                ).style.display =
                    "block";

                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });

            })

            .catch(error => {

                console.error(
                    "Error editing appointment:",
                    error
                );

            });

    }

    // ==========================================
    // DELETE APPOINTMENT
    // ==========================================

    function deleteAppointment(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this appointment?"
            );

        if (!confirmDelete) {

            return;

        }

        fetch(
            `/api/appointments/${id}`,
            {
                method: "DELETE"
            }
        )

        .then(response => response.json())

        .then(data => {

            alert(data.message);

            loadAppointments();

        })

        .catch(error => {

            console.error(
                "Error deleting appointment:",
                error
            );

        });

    }

    // ==========================================
    // CANCEL EDIT
    // ==========================================

    function cancelEdit() {

        resetForm();

    }

    // ==========================================
    // RESET FORM
    // ==========================================

    function resetForm() {

        editingAppointmentId = null;

        document
            .getElementById("appointmentForm")
            .reset();

        document.getElementById(
            "submitButton"
        ).textContent =
            "Add Appointment";

        document.getElementById(
            "cancelButton"
        ).style.display =
            "none";

    }

    // ==========================================
    // FORMAT DATE
    // ==========================================

    function formatDate(date) {

        if (!date) {

            return "";

        }

        const d = new Date(date);

        const year =
            d.getFullYear();

        const month =
            String(
                d.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                d.getDate()
            ).padStart(2, "0");

        return `${day}-${month}-${year}`;

    }

    // ==========================================
    // FORMAT DATE FOR INPUT
    // ==========================================

    function formatDateForInput(date) {

        if (!date) {

            return "";

        }

        const d = new Date(date);

        const year =
            d.getFullYear();

        const month =
            String(
                d.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                d.getDate()
            ).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }

    // ==========================================
    // FORMAT TIME
    // ==========================================

    function formatTime(time) {

        if (!time) {

            return "";

        }

        const parts =
            String(time).split(":");

        let hour =
            parseInt(parts[0]);

        const minute =
            parts[1];

        const ampm =
            hour >= 12 ? "PM" : "AM";

        hour =
            hour % 12;

        if (hour === 0) {

            hour = 12;

        }

        return `${hour}:${minute} ${ampm}`;

    }

    // ==========================================
    // FORMAT TIME FOR INPUT
    // ==========================================

    function formatTimeForInput(time) {

        if (!time) {

            return "";

        }

        const parts =
            String(time).split(":");

        return `${parts[0]}:${parts[1]}`;

    }

    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadPatients();

    loadDoctors();

    loadAppointments();

</script>

</body>

</html>
